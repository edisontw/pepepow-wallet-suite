server {
  listen 80;
  server_name wallet.pepepow.net;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name wallet.pepepow.net;

  ssl_certificate     /etc/letsencrypt/live/wallet.pepepow.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wallet.pepepow.net/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;

  root /srv/wallet;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
