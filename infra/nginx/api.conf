server {
  listen 80;
  server_name api.pepepow.net;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name api.pepepow.net;

  ssl_certificate     /etc/letsencrypt/live/api.pepepow.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.pepepow.net/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;

  location = /auth/telegram {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /wallet/healthz {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /wallet/readyz {
    proxy_pass http://127.0.0.1:9194;
  }

  location /wallet/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location / {
    proxy_pass http://127.0.0.1:9193;
  }
}
