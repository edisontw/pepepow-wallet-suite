server {
  listen 80;
  server_name api.pepepow.net;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name api.pepepow.net;

  ssl_certificate     /etc/letsencrypt/live/api.pepepow.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.pepepow.net/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;

  location = /auth/telegram {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /api/auth/telegram {
    proxy_pass http://127.0.0.1:9194;
  }

  location ^~ /wallet/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location ^~ /tg/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/whoami {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/profile/upsert {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/address/default {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/resolve {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/requests {
    proxy_pass http://127.0.0.1:9194;
  }

  location ^~ /v1/requests/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/history {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /v1/price {
    proxy_pass http://127.0.0.1:9194;
  }

  location ^~ /v1/tx/raw/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /health {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /readyz {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /docs {
    proxy_pass http://127.0.0.1:9193;
  }

  location ^~ /docs/ {
    proxy_pass http://127.0.0.1:9193;
  }

  location ^~ /v1/chain/ {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /v1/fee/estimate {
    proxy_pass http://127.0.0.1:9193;
  }

  location ^~ /v1/addr/ {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /v1/mempool/info {
    proxy_pass http://127.0.0.1:9193;
  }

  location ^~ /v1/tx/ {
    proxy_pass http://127.0.0.1:9193;
  }

  location / {
    proxy_pass http://127.0.0.1:9194;
  }
}
