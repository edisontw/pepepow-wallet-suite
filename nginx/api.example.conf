# Nginx configuration template for api.example.com
# Proxying to pepew-api (:9193) and wallet-api (:9194)

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # SSL - Replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate Limiting (Define zone in nginx.conf)
    # limit_req zone=api_limit burst=20 nodelay;

    # Logging
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Wallet API (Telegram Auth & Transaction Broadcast)
    location /wallet/ {
        proxy_pass http://127.0.0.1:9194/;
    }

    location /auth/telegram {
        proxy_pass http://127.0.0.1:9194/auth/telegram;
    }

    # PEPEW API (Chain Data Indexer) - Default
    location / {
        proxy_pass http://127.0.0.1:9193;
    }

    # Health Checks
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:9193;
        access_log off;
    }

    # Deny sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
