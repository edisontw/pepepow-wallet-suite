# Nginx configuration template for wallet.example.com
# Serving static Web Wallet frontend

server {
    listen 80;
    server_name wallet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wallet.example.com;

    # SSL - Replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/wallet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.com/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static Root
    root /srv/wallet;
    index index.html;

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
