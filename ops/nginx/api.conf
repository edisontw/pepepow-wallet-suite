server {
  listen 80;
  listen [::]:80;
  server_name api.pepepow.net;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.pepepow.net;

  ssl_certificate /etc/letsencrypt/live/api.pepepow.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.pepepow.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;

  location = /healthz {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /readyz {
    proxy_pass http://127.0.0.1:9193;
  }

  location = /auth/telegram {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /wallet/healthz {
    proxy_pass http://127.0.0.1:9194;
  }

  location = /wallet/readyz {
    proxy_pass http://127.0.0.1:9194;
  }

  location /wallet/ {
    proxy_pass http://127.0.0.1:9194;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:9193;
  }

  location / {
    proxy_pass http://127.0.0.1:9193;
  }
}
